name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    name: Native Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: P7A1R Media Foundation resampler evidence
        shell: pwsh
        run: |
          $probe = Join-Path $PWD "build/windows-x64/Release/arssyut_p7a1r_mf_resampler_probe.exe"
          if (-not (Test-Path $probe)) {
            throw "P7A1R resampler probe executable is missing."
          }
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "P7A1R Media Foundation resampler probe failed with exit code $LASTEXITCODE"
          }

      - name: GUI launch smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/windows-x64/Release/arssyut.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 2

          if ($process.HasExited) {
            throw "arssyut.exe exited during GUI launch smoke with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Prepare application package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/arssyut"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/windows-x64/Release/arssyut.exe" $package
          Copy-Item "tools/app_package/README.txt" $package
          Copy-Item "third_party/lucide/LICENSE" (Join-Path $package "LUCIDE_LICENSE.txt")

      - name: Upload native recorder
        uses: actions/upload-artifact@v4
        with:
          name: arssyut-recorder-windows-x64
          path: dist/arssyut/*
          if-no-files-found: error
          retention-days: 90

  p7a5-swresample-adapter:
    name: P7A5 libswresample adapter evidence
    # Only explicitly requested product integration compiles against pinned
    # static FFmpeg. Normal UI/portable CI stays cheap and dependency-free.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/p7a5-swresample-adapter-v1' || github.head_ref == 'feat/p7-product-audio-integration-v1')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned FFmpeg install cache
        uses: actions/cache@v4
        with:
          path: build/p7a5-vcpkg
          key: p7a5-ffmpeg-9.0.2-x64-windows-static-617ef1c0c422737d117eda00a471ea1be5bad088-v1

      - name: Install pinned libswresample
        shell: pwsh
        run: |
          $pinnedVcpkgCommit = "617ef1c0c422737d117eda00a471ea1be5bad088"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT

          git -C $vcpkgRoot fetch origin $pinnedVcpkgCommit --depth=1
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch pinned vcpkg revision."
          }

          git -C $vcpkgRoot checkout --detach --force $pinnedVcpkgCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout pinned vcpkg revision."
          }

          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap pinned vcpkg."
          }

          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          $installRoot = Join-Path $PWD "build/p7a5-vcpkg"

          & $vcpkg install "ffmpeg[core,swresample]:x64-windows-static" --x-install-root="$installRoot"
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned libswresample install failed."
          }

          $installed = (& $vcpkg list --x-install-root="$installRoot") -join "`n"
          if ($installed -notmatch "ffmpeg:x64-windows-static\s+9\.0\.2") {
            throw "P7A5 candidate drifted: expected FFmpeg 9.0.2."
          }

          $evidenceDir = Join-Path $PWD "dist/p7a5-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $libDir = Join-Path $installRoot "x64-windows-static/lib"
          $swresample = Join-Path $libDir "swresample.lib"
          $avutil = Join-Path $libDir "avutil.lib"
          $license = Join-Path $installRoot "x64-windows-static/share/ffmpeg/copyright"

          @(
            "ffmpeg_version=9.0.2",
            "vcpkg_commit=$pinnedVcpkgCommit",
            "swresample_bytes=$((Get-Item $swresample).Length)",
            "swresample_sha256=$((Get-FileHash $swresample -Algorithm SHA256).Hash)",
            "avutil_bytes=$((Get-Item $avutil).Length)",
            "avutil_sha256=$((Get-FileHash $avutil -Algorithm SHA256).Hash)"
          ) | Set-Content (Join-Path $evidenceDir "dependency.txt")
          Copy-Item $license (Join-Path $evidenceDir "FFMPEG_COPYRIGHT.txt")

      - name: Configure isolated adapter tests
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          $installed = Join-Path $PWD "build/p7a5-vcpkg"

          cmake --preset windows-x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_INSTALLED_DIR="$installed" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DARSSYUT_BUILD_TESTS=ON -DARSSYUT_BUILD_P7A5_SWRESAMPLE_ADAPTER_TESTS=ON -DARSSYUT_ENABLE_PRODUCT_AUDIO=ON

      - name: Build isolated adapter tests
        run: # Product build must compile/link both actual RecorderSession entry
          # points against the selected static FFmpeg backend, not just tests.
          cmake --build --preset windows-release --target arssyut_p7a5_swresample_adapter_tests arssyut_native_bridge arssyut --parallel

      - name: Run adapter contract evidence
        shell: pwsh
        run: |
          $test = Join-Path $PWD "build/windows-x64/Release/arssyut_p7a5_swresample_adapter_tests.exe"
          if (-not (Test-Path $test)) {
            throw "P7A5 adapter test executable is missing."
          }

          & $test
          if ($LASTEXITCODE -ne 0) {
            throw "P7A5 adapter contract tests failed with exit code $LASTEXITCODE"
          }

      - name: Setup .NET 10 for internal hardware-audio preview
        if: github.head_ref == 'feat/p7-product-audio-integration-v1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish INTERNAL FFmpeg-enabled Avalonia recorder
        if: github.head_ref == 'feat/p7-product-audio-integration-v1'
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/arssyut-audio-acceptance"
          $native = Join-Path $PWD "src/ui/Arssyut.UI/Native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "build/windows-x64/Release/arssyut_native_bridge.dll" `
            (Join-Path $native "arssyut_native_bridge.dll") -Force

          dotnet publish src/ui/Arssyut.UI/Arssyut.UI.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o $package
          if ($LASTEXITCODE -ne 0) {
            throw "Internal FFmpeg-enabled UI publish failed."
          }

          if (-not (Test-Path (Join-Path $package "Arssyut.UI.exe"))) {
            throw "Hardware audio acceptance executable missing."
          }
          if (Test-Path (Join-Path $package "arssyut_native_bridge.dll")) {
            throw "Experimental engine must be embedded in the single-file UI."
          }
          Get-ChildItem $package -Filter "*.pdb" -ErrorAction SilentlyContinue |
            Remove-Item -Force

          Copy-Item "dist/p7a5-evidence/FFMPEG_COPYRIGHT.txt" `
            (Join-Path $package "FFMPEG_COPYRIGHT.txt") -Force
          Copy-Item "dist/p7a5-evidence/dependency.txt" `
            (Join-Path $package "DEPENDENCY_PIN.txt") -Force
          Copy-Item "docs/P6UI_THIRD_PARTY_NOTICES.md" `
            (Join-Path $package "THIRD_PARTY_NOTICES.md") -Force

          @'
          @echo off
          set "ARSSYUT_AUDIO_PREVIEW=1"
          start "" "%~dp0Arssyut.UI.exe"
          '@ | Set-Content -Encoding ascii (Join-Path $package "START_AUDIO_PREVIEW.cmd")

          @'
          INTERNAL WINDOWS HARDWARE AUDIO ACCEPTANCE — NOT A PUBLIC RELEASE

          1. Unzip the complete artifact on Windows 10/11 x64.
          2. Double-click START_AUDIO_PREVIEW.cmd.
          3. In the Audio panel, enable Microphone, System audio, or both.
          4. Select a microphone from the detected real Windows device list.
             System audio uses the default Windows eConsole playback endpoint.
          5. Record a short display video, stop, and PLAY the resulting MP4.
          6. Check audible audio, A/V sync, Stop completion and any error.
          7. Repeat for Mic-only, System-only, and dual source. Report the
             session diagnostics and reproducible device configuration.

          CAUTION: This opt-in package has not passed real-device audio
          acceptance yet. Do not replace the stable video-only release.
          The experimental bridge refuses Mic/System unless the launcher
          explicitly sets ARSSYUT_AUDIO_PREVIEW=1. Camera remains unsupported.
          FFmpeg linkage and redistribution require licensing review.
          '@ | Set-Content (Join-Path $package "README_AUDIO_ACCEPTANCE.txt")

      - name: Internal preview launch smoke (no device requested)
        if: github.head_ref == 'feat/p7-product-audio-integration-v1'
        shell: pwsh
        run: |
          $env:ARSSYUT_AUDIO_PREVIEW = "1"
          $exe = Join-Path $PWD "dist/arssyut-audio-acceptance/Arssyut.UI.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--bridge-required" -PassThru
          try {
            Start-Sleep -Seconds 4
            if ($process.HasExited) {
              throw "Experimental audio UI exited early: $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload INTERNAL audio hardware acceptance package
        if: github.head_ref == 'feat/p7-product-audio-integration-v1'
        uses: actions/upload-artifact@v4
        with:
          name: arssyut-INTERNAL-audio-acceptance-win-x64
          path: dist/arssyut-audio-acceptance/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload P7A5 dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: p7a5-swresample-adapter-dependency-evidence
          path: dist/p7a5-evidence/*
          if-no-files-found: error
          retention-days: 90

  p6ui-windows:
    name: P6UI Avalonia Windows x64
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Guard locked native baseline during P6UI
        shell: pwsh
        run: |
          $baseline = "b11451bd640a072d81dbd1024b4c641a76c9daac"

          # checkout@v4 uses a shallow PR merge checkout. Fetch exactly the
          # historical P6R baseline tree before comparing protected engine paths.
          git fetch origin $baseline --depth=1

          $allowedNativeCorrections = @(
            # P6UI.4C-B reproduced Region layered-window repaint correction.
            "src/app/recorder_overlay.cpp",
            # P6UI.6A-6C bounded presenter command / momentary release plumbing
            # only. Capture, timing, compositor, encoder and RecorderSession
            # lifecycle remain unchanged.
            "src/app/recorder_session.cpp",
            "src/app/recorder_session.hpp",
            # P6UI.6B/6C reads the already-authoritative Raw Input pressed-state
            # table for momentary presenter chords. P6UI.6C adds only a
            # GetAsyncKeyState stale-release fuse; it cannot activate a chord
            # and does not add a second keyboard hook.
            "src/platform/windows/input/presentation_input_worker.hpp"
          )

          # Keep reproduced native corrections fail-closed at exact Git blobs.
          # These are not a broad allowlist: each path below has a documented
          # acceptance reason and deterministic regression coverage.
          $lockedNativeCorrectionBlobs = @{
            # P6UI.6D/P6UI.6F retained Spotlight + keycap destination-rect path,
            # plus final Region Smart Auto crop normalization.
            "src/platform/windows/graphics/d3d11_compositor.cpp" = "97f7e203dc75620f9abd74901f4b88dac87f29b1"
            "src/platform/windows/graphics/d3d11_compositor.hpp" = "6810588fd42e267c26528b2b17be2e93b74e9547"
            # Final review gate: 64x36 async scene analyzer samples only the
            # canonical encoded Region UV rectangle.
            "src/platform/windows/graphics/d3d11_arvisual_scene_analyzer.cpp" = "fd8c16a4493dab3ee61a88e5c3a055a07786dcab"
            "src/platform/windows/graphics/d3d11_arvisual_scene_analyzer.hpp" = "a8d9e45f402df0ede482067390e612d97ad276af"
            "src/platform/windows/video/native_video_pipeline.cpp" = "01a75b2715cc737af61aba71a431a5846ffb023d"
            # Final review gate: protect the visible legacy/native workspace
            # before WGC starts so recorder chrome cannot leak into Display/
            # Region output.
            "src/app/windows_main.cpp" = "f75b48c688023d9c154cf472a3ff7ef0fda28c30"

            # P7A6 exact production source-ready and AAC handoff contracts.
            "src/app/audio_startup_gate.hpp" = "453a2fe2b1beea85d093244c77b68df2dff35771"
            "src/app/audio_source_preparation.hpp" = "5f64b96540f5a98d319c5af793cc5cbe868f8b21"
            "src/app/audio_endpoint_preflight.hpp" = "859170accf6351963fa51326ebcad6170293a148"
            "src/app/audio_pcm16_submission_adapter.hpp" = "d69fdccb252f6ba6c0dd0cef6d9dc444a81cff52"
            # P7A6 sole RecorderSession product audio owner (opt-in).
            "src/app/audio_product_runtime.hpp" = "4aa719fae81ec7a20813b027aa9e7ae455e44d91"
            # Experimental-only bridge approval: default/release still
            # rejects audio. Mic tokens are generation checked.
            "src/bridge/native_bridge.cpp" = "c17fd0d0744570124110155d495b53428a8fb174"

            # P7A1 canonical portable audio contracts. These exact blobs are
            # intentionally admitted after the P7A architecture/acceptance lock;
            # later audio lanes must not silently mutate the shared contract.
            "src/core/audio/audio_buffer.hpp" = "f7f8bb04d25f439a727280a93061e9add2dcd513"
            "src/core/audio/audio_drift.hpp" = "c59ddca3e76a6c825615311bcde6592d2db39022"
            "src/core/audio/audio_format.hpp" = "e1d597197ac14cd4bbe69f67f07442641f6941ae"
            "src/core/audio/audio_mix.hpp" = "4b773669f3213bd0308e7c37774a02f0366ee639"
            "src/core/audio/audio_packet.hpp" = "4b95111fccceaf8b45436499115b79b52544f10d"
            "src/core/audio/audio_resampler.hpp" = "f207dee9b689b176d000209ef7760d7110ba6fa3"
            "src/core/audio/audio_time.hpp" = "c80c0f60ca6d73fe8f2f305c5a76ed3eca1260fb"

            # P7A5 canonical program timing/mixer/window core. These exact
            # reviewed blobs preserve one 48 kHz/1024-frame authority,
            # bounded source-window semantics and lock-free telemetry
            # publication without admitting arbitrary future core changes.
            "src/core/audio/audio_program_clock.hpp" = "ac37912426c7b1e42a846e95b938182df8caf8b1"
            "src/core/audio/audio_program_mixer.hpp" = "14652f0ea21446483796aad7d29b1210bc9dd4a1"
            "src/core/audio/audio_source_block_window.hpp" = "801fc8a4440f626d6220ccfec462cd6196b929e5"
            # P7A5 source mapper creates no new clock; exact reviewed blob maps
            # capture QPC into the RecorderSession media-zero domain.
            "src/core/audio/audio_source_timeline_mapper.hpp" = "65e4aa33179c65b690a6fce6a7769b8836ecc73d"
            # P7A5 drift policy consumes only accepted trusted drift estimates;
            # exact blob keeps slew/deadband/reanchor semantics fail-closed.
            "src/core/audio/audio_drift_controller.hpp" = "af7c342d17126c2781ad9d15f9fe56a156c5d184"
            # P7A5 native-container normalizer converts retained endpoint PCM/float
            # into allocation-free float32 without creating rate/timeline authority.
            "src/core/audio/audio_sample_normalizer.hpp" = "4fcb7e54bb7a36235b578c8b8fdcfb497da2f144"
            # P7A5 fixed canonical staging retains already-produced future SRC
            # suffixes without unbounded growth or a second timing authority.
            "src/core/audio/audio_canonical_staging.hpp" = "64d57912a54977a526e19ea4d18f5a62299cc16b"
            # P7A5 closed-program assembly: vetted exact blob composes the
            # existing staging/windows/mixer; no replacement clock or backend.
            "src/core/audio/audio_canonical_program_assembler.hpp" = "506256245d20ffa0efb487d27f4d63077782aa28"
            # P7A5 typed packet lease -> native normalization -> mapped
            # canonical SRC ingress, exact blob; no unreviewed core drift.
            "src/core/audio/audio_packet_ingress.hpp" = "28525e79048aa288a608022b64288bee0a62130e"

            # P7A2 event-driven microphone source and the deliberately shared
            # Windows-audio seam that P7A3 must reuse rather than clone.
            "src/platform/windows/audio/wasapi_audio_utils.hpp" = "8bde8701ab524119f99ca95049ce507084141a5e"
            "src/platform/windows/audio/wasapi_capture_source.hpp" = "d58125d520808b2fdb75cbc8bf490e02e41d8a55"
            "src/platform/windows/audio/wasapi_capture_source.cpp" = "eb2e929a0907fb966f99d33b739831703c16ea12"
            "src/platform/windows/audio/wasapi_microphone_source.hpp" = "7e7e71deae21cc1b8d17609500d6233555ca2995"
            "src/platform/windows/audio/wasapi_microphone_source.cpp" = "ef821592ee5ce01505ae11fcb309ff42caecb1d3"
            "src/platform/windows/audio/wasapi_loopback_source.hpp" = "41ac273b3e3425df397ec38217d64e117473851e"
            "src/platform/windows/audio/wasapi_loopback_source.cpp" = "b0a4666811d3392b4572ccda7d7066f253f5a7dc"
            # P7A5 selected libswresample adapter. Product linkage remains
            # disabled by default; these blobs are exercised only in the
            # dedicated pinned-dependency adapter lane until packaging is
            # explicitly accepted.
            "src/platform/windows/audio/libswresample_audio_resampler.hpp" = "8662ffeffa0c867f3be519ad71fe29fae5bd477a"
            "src/platform/windows/audio/libswresample_audio_resampler.cpp" = "7ed56bb608b4f545c0f050b175b1ef41dd87bde9"
            # P7A4 evolves the accepted single Media Foundation writer into one
            # optional AV authority. Exact blobs keep the video path fail-closed
            # while allowing only the audited AAC/PCM16 extension.
            "src/platform/windows/media/mf_h264_mp4_writer.hpp" = "0fe410330d192a58724c03e0583ccd2458f31263"
            "src/platform/windows/media/mf_h264_mp4_writer.cpp" = "deebd6c1f329fd850a095ad1538b9ec0aaf90cc8"
          }

          $changedNative = @(
            git diff --name-only $baseline HEAD -- src/app src/core src/platform
          )
          $violations = @()

          foreach ($path in $changedNative) {
            if ($allowedNativeCorrections -contains $path) {
              continue
            }

            if ($lockedNativeCorrectionBlobs.ContainsKey($path)) {
              $actualBlob = (git rev-parse "HEAD:$path").Trim()
              $expectedBlob = $lockedNativeCorrectionBlobs[$path]
              if ($actualBlob -eq $expectedBlob) {
                Write-Host "Locked native correction verified: $path @ $actualBlob"
                continue
              }

              Write-Host "Locked native correction drifted: $path"
              Write-Host "  expected blob: $expectedBlob"
              Write-Host "  actual blob:   $actualBlob"
            }

            $violations += $path
          }

          if ($violations.Count -gt 0) {
            Write-Host "P6UI changed locked native implementation after ${baseline}:"
            $violations | Sort-Object -Unique | ForEach-Object { Write-Host "  $_" }
            throw "Existing native engine implementation is frozen. Only documented corrections are allowed; retained compositor changes must match the audited exact blob."
          }

          Write-Host "Native baseline guard passed."

      - name: Build P6UI native bridge
        shell: pwsh
        run: |
          cmake --preset windows-x64
          cmake --build --preset windows-release --target arssyut_native_bridge --parallel

      - name: Stage native bridge for single-file UI
        shell: pwsh
        run: |
          $native = Join-Path $PWD "src/ui/Arssyut.UI/Native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          Copy-Item "build/windows-x64/Release/arssyut_native_bridge.dll" `
            (Join-Path $native "arssyut_native_bridge.dll") -Force

      - name: Restore
        run: dotnet restore src/ui/Arssyut.UI/Arssyut.UI.csproj

      - name: Build
        run: dotnet build src/ui/Arssyut.UI/Arssyut.UI.csproj -c Release --no-restore

      - name: Validate audio toggles are actually bound
        shell: pwsh
        run: |
          $xaml = Get-Content "src/ui/Arssyut.UI/MainWindow.axaml" -Raw
          foreach ($binding in @(
            @("SystemAudioToggle", "SystemAudioToggle_OnClick"),
            @("MicToggle", "MicToggle_OnClick")
          )) {
            $pattern = '<ToggleSwitch\s+x:Name="' + $binding[0] +
              '"[^>]*Click="' + $binding[1] + '"'
            if (-not [regex]::IsMatch($xaml, $pattern, 'Singleline')) {
              throw "Audio toggle $($binding[0]) is not wired to its state handler."
            }
          }

      - name: Interaction-state regression
        run: dotnet run --project tests/ui/Arssyut.UI.InteractionTests/Arssyut.UI.InteractionTests.csproj -c Release

      - name: Publish Windows x64 preview
        shell: pwsh
        run: |
          dotnet publish src/ui/Arssyut.UI/Arssyut.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o dist/arssyut-p6ui

          Get-ChildItem "dist/arssyut-p6ui" -Filter "*.pdb" -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item "docs/P6UI_THIRD_PARTY_NOTICES.md" (Join-Path "dist/arssyut-p6ui" "THIRD_PARTY_NOTICES.md")

      - name: Verify single-file native-engine package
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/arssyut-p6ui"
          $exe = Join-Path $package "Arssyut.UI.exe"
          $externalBridge = Join-Path $package "arssyut_native_bridge.dll"

          if (-not (Test-Path $exe)) {
            throw "Single-file UI executable is missing."
          }

          if (Test-Path $externalBridge) {
            throw "Native bridge escaped the single-file bundle; product artifact can still be detached from its engine."
          }

          $unexpected = @(
            Get-ChildItem $package -File |
              Where-Object { $_.Extension -eq ".pdb" }
          )

          if ($unexpected.Count -gt 0) {
            throw "Debug symbols leaked into the product preview artifact."
          }

          Write-Host "Single-file native-engine package verified."

      - name: Launch smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/arssyut-p6ui/Arssyut.UI.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--bridge-required" -PassThru
          Start-Sleep -Seconds 3

          if ($process.HasExited) {
            throw "Arssyut.UI.exe exited during launch smoke with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Interaction stress smoke
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/arssyut-p6ui/Arssyut.UI.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--stress-long-names","--controller-preview" -PassThru
          Start-Sleep -Seconds 4

          if ($process.HasExited) {
            throw "P6UI interaction stress scenario exited with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force

      - name: Controller capture-exclusion smoke
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class ArssyutCaptureAffinityProbe
          {
              private static uint targetProcessId;
              private static string targetTitle = "";
              private static IntPtr foundWindow = IntPtr.Zero;

              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

              [DllImport("user32.dll", SetLastError = true)]
              private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);

              [DllImport("user32.dll", SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool GetWindowDisplayAffinity(IntPtr hWnd, out uint affinity);

              private static bool Visit(IntPtr hWnd, IntPtr lParam)
              {
                  uint processId;
                  GetWindowThreadProcessId(hWnd, out processId);
                  if (processId != targetProcessId)
                      return true;

                  var title = new StringBuilder(256);
                  GetWindowText(hWnd, title, title.Capacity);
                  if (String.Equals(title.ToString(), targetTitle, StringComparison.Ordinal))
                  {
                      foundWindow = hWnd;
                      return false;
                  }

                  return true;
              }

              public static uint Read(uint processId, string title)
              {
                  targetProcessId = processId;
                  targetTitle = title;
                  foundWindow = IntPtr.Zero;
                  EnumWindows(Visit, IntPtr.Zero);

                  if (foundWindow == IntPtr.Zero)
                      throw new InvalidOperationException("Recording controller HWND was not found.");

                  uint affinity;
                  if (!GetWindowDisplayAffinity(foundWindow, out affinity))
                      throw new InvalidOperationException("GetWindowDisplayAffinity failed.");

                  return affinity;
              }
          }
          "@

          $exe = Join-Path $PWD "dist/arssyut-p6ui/Arssyut.UI.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--controller-preview" -PassThru

          try {
            Start-Sleep -Seconds 3

            if ($process.HasExited) {
              throw "Controller affinity smoke exited early with code $($process.ExitCode)"
            }

            $affinity = [ArssyutCaptureAffinityProbe]::Read(
              [uint32]$process.Id,
              "Arssyut Recording Controller")

            # 0x11 = WDA_EXCLUDEFROMCAPTURE. 0x1 = compatibility WDA_MONITOR fallback.
            if ($affinity -ne 0x11 -and $affinity -ne 0x1) {
              throw ("Recording controller is not capture-protected; affinity=0x{0:X}" -f $affinity)
            }

            Write-Host ("Recording controller capture affinity verified: 0x{0:X}" -f $affinity)
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }


