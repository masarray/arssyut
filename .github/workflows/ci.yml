name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-release:
    name: Windows x64 Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: Upload P1 capture probe
        uses: actions/upload-artifact@v4
        with:
          name: arssyut-p1-probe-windows-x64
          path: build/windows-x64/Release/arssyut_p1_probe.exe
          if-no-files-found: error
          retention-days: 90
