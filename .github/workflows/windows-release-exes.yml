name: Windows Release Candidate EXEs
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful audio-enabled CI run ID for exact main SHA"
        required: true
        type: string
      version:
        description: "Release candidate version (e.g. 0.1.0-rc.2)"
        required: true
        type: string
      publish_prerelease:
        description: "Publish a labeled preview GitHub Release"
        required: true
        type: boolean
        default: false
      publish_stable:
        description: "Publish a stable GitHub Release after hardware signoff"
        required: true
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  package:
    # Manual dispatch only. No commit-message-triggered release.
    # Only exact successful main CI audio-enabled artifact is accepted.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact-head audio CI provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
          VERSION: ${{ inputs.version }}
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
        run: |
          # Reject wrong branch, invalid release version, and mismatched flags
          # BEFORE downloading or publishing any public binary.
          $validVersion = [regex]::IsMatch(
            $env:VERSION, '\A0\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?\z')
          $validRunId = [regex]::IsMatch($env:RUN_ID, '\A[0-9]+\z')
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or
              -not $validVersion -or -not $validRunId) {
            throw 'Invalid release branch, version or source run ID'
          }
          $isRc = $env:VERSION.Contains('-rc.')
          $stable = $env:PUBLISH_STABLE -eq 'true'
          $preview = $env:PUBLISH_PRERELEASE -eq 'true'
          if ($stable -and ($isRc -or $preview)) {
            throw 'Stable release requires x.y.z and prerelease=false'
          }
          if ($preview -and -not $isRc) {
            throw 'Preview release requires -rc.N version'
          }
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $null -eq $source) {
            throw 'Could not query source CI run'
          }
          if ($source.head_sha -ne $env:GITHUB_SHA -or
              $source.conclusion -ne 'success' -or
              $source.head_branch -ne 'main' -or
              $source.name -ne 'CI') {
            throw 'Source is not successful exact-head main CI'
          }
      - name: Download verified audio-capable portable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.source_run_id }}
        run: |
          New-Item -ItemType Directory -Force dist/publish | Out-Null
          gh run download $env:RUN_ID --repo $env:GITHUB_REPOSITORY --name arssyut-AUDIO-ENABLED-TEST-win-x64 --dir dist/publish
          if ($LASTEXITCODE -ne 0) { throw 'Missing audio-enabled artifact' }
          $exe = 'dist/publish/Arssyut.UI.exe'
          if (-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 5000000) { throw 'Standalone GUI missing or too small' }
          if (Test-Path dist/publish/arssyut_native_bridge.dll) { throw 'Portable DLL is not embedded' }
          # The CI artifact is an internal hardware-acceptance ZIP.
          # Do not copy its INTERNAL-only instructions into public Setup files.
          Remove-Item dist/publish/README_AUDIO_ACCEPTANCE.txt -Force -ErrorAction SilentlyContinue
          foreach ($notice in @('FFMPEG_COPYRIGHT.txt', 'THIRD_PARTY_NOTICES.md', 'DEPENDENCY_PIN.txt')) {
            if (-not (Test-Path (Join-Path dist/publish $notice))) {
              throw "Required audio redistribution notice missing: $notice"
            }
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
          if ($null -eq $icon) { throw 'PE icon missing' }
          $icon.Dispose()
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno install failed' }
      - name: Build two EXE release assets from identical binary
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC missing' }
          $publish = (Resolve-Path dist/publish).Path
          & $iscc '/Qp' "/DAppVersion=$env:VERSION" "/DAppPublishDir=$publish" packaging/windows/Arssyut.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno compilation failed' }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          $setup = "dist/installer/Arssyut-Setup-$env:VERSION-win-x64.exe"
          if (-not (Test-Path $setup)) { throw 'Setup output missing' }
          Copy-Item $setup dist/release/
          Copy-Item dist/publish/Arssyut.UI.exe "dist/release/Arssyut-$env:VERSION-portable-win-x64.exe"
          $exeFiles = @(Get-ChildItem dist/release -File)
          if ($exeFiles.Count -ne 2 -or @($exeFiles | Where-Object Extension -ne '.exe').Count -ne 0) { throw 'Expected exactly two EXEs' }
          $exeFiles | ForEach-Object { "$($_.Name) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Set-Content dist/SHA256SUMS.txt
      - name: Smoke test EXACT portable and installed Setup EXE on Windows
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $portable = (Resolve-Path "dist/release/Arssyut-$env:VERSION-portable-win-x64.exe").Path
          $setup = (Resolve-Path "dist/release/Arssyut-Setup-$env:VERSION-win-x64.exe").Path
          $sourceHash = (Get-FileHash dist/publish/Arssyut.UI.exe -Algorithm SHA256).Hash
          if ((Get-FileHash $portable -Algorithm SHA256).Hash -ne $sourceHash) {
            throw 'Portable differs from verified audio-enabled CI executable'
          }

          function Assert-GuiLaunch([string]$exe) {
            $process = Start-Process -FilePath $exe -ArgumentList '--bridge-required' -PassThru
            try {
              Start-Sleep -Seconds 5
              $process.Refresh()
              if ($process.HasExited) {
                throw "Audio-enabled GUI exited during launch smoke: $exe, exit $($process.ExitCode)"
              }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
          }

          Assert-GuiLaunch $portable
          $installDir = Join-Path $env:TEMP "ArssyutSetupSmoke-$env:GITHUB_RUN_ID"
          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            "/DIR=$installDir"
          ) -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Setup failed: $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'Arssyut.UI.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed Arssyut.UI.exe is missing' }
          if ((Get-FileHash $installedExe -Algorithm SHA256).Hash -ne $sourceHash) {
            throw 'Installer did not deploy the exact verified audio-enabled GUI'
          }
          Assert-GuiLaunch $installedExe

          $uninstallExe = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstallExe)) { throw 'Inno uninstaller is missing' }
          $uninstall = Start-Process -FilePath $uninstallExe -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw 'Uninstall left the installed application executable behind' }

          Write-Host 'PASS: portable GUI, Setup install, exact binary, installed GUI, Inno uninstall.'
          Write-Host 'NOTE: Windows runner smoke cannot certify physical Mic/System Audio, A/V sync or captured MP4.'

      - uses: actions/upload-artifact@v4
        with:
          name: arssyut-RELEASE-CANDIDATE-EXEs
          path: |
            dist/release/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified GitHub release (manual opt-in)
        if: ${{ inputs.publish_prerelease || inputs.publish_stable }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Tag already exists; refusing overwrite' }
          $stable = $env:PUBLISH_STABLE -eq 'true'
          $channel = if ($stable) { 'Stable' } else { 'Preview' }
          $notes = @"
          ARSSYUT_AUDIO_HARDWARE_ACCEPTED

          Arssyut $tag — Windows $channel
          
          Windows x64 screen recorder with Display, Window and Region capture; 1080p60
          GPU H.264 recording; Media Foundation webcam live preview and Camera PIP
          (Circle, Rounded Rectangle, and diagonal masks with adjustable width);
          transparent PNG logo overlay; Windows playback endpoint choice including
          HDMI and USB audio devices; System Audio + Microphone AAC stereo recording,
          audio meters and mute; Pause/Resume; presenter zoom and click visualization.
          
          Release source commit: $env:GITHUB_SHA
          Successful exact-source Windows A/V CI: $env:SOURCE_RUN_ID
          Installer and Portable contain the byte-identical verified GUI.
          Windows CI performs GUI launch, install, and uninstall smoke tests.
          
          Hardware evidence: user-supplied 2026-10-13 08:28 recording, 1920x1080,
          60fps, dual-source audio (2,675 system packets, 2,675 microphone packets),
          two Pause/Resume transitions, completed MP4 with no encoder errors,
          no webcam GPU copy errors, and one video skipped frame.
          This is not certification for every webcam, audio interface or long recording.
          Please report reproducible device problems via GitHub Issues.
          
          Windows binaries are not commercially code-signed. Microsoft SmartScreen
          can warn on new publisher binaries. Distributed under GPL-2.0-or-later
          with third-party copyright notices for linked dependencies.
          "@
          $assets = @(Get-ChildItem dist/release -Filter '*.exe' |
            ForEach-Object FullName)
          $assets += (Resolve-Path dist/SHA256SUMS.txt).Path
          if ($assets.Count -ne 3) {
            throw 'Expected exactly two executables plus SHA256SUMS'
          }
          $arguments = @('release', 'create', $tag) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Arssyut $tag Windows $channel",
            '--notes', $notes
          )
          if ($stable) {
            $arguments += '--latest'
          } else {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed'
          }
